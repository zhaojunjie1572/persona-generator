<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎭 AI人物重现器 - CharRole</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #0a0a1a;
            --bg-secondary: #12122a;
            --bg-tertiary: #1a1a3a;
            --accent-pink: #ff6b9d;
            --accent-purple: #c850c0;
            --accent-blue: #4facfe;
            --accent-gold: #ffd700;
            --accent-orange: #ff9f43;
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --border: rgba(255,255,255,0.08);
            --chat-height: 65vh;
        }
        body { font-family: 'Microsoft YaHei', sans-serif; background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; }
        .bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 30% 30%, rgba(200,80,192,0.12), transparent 50%), radial-gradient(circle at 70% 70%, rgba(79,172,254,0.12), transparent 50%); z-index: -1; }
        .container { max-width: 800px; margin: 0 auto; padding: 30px 20px; padding-bottom: calc(var(--chat-height) + 120px); }
        header { text-align: center; padding: 20px 0; position: relative; }
        header h1 { font-size: 2em; background: linear-gradient(135deg, var(--accent-gold), var(--accent-orange), var(--accent-pink)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 8px; }
        header p { color: var(--text-secondary); font-size: 0.95em; }
        .header-actions { display: flex; justify-content: center; gap: 10px; margin-top: 12px; }
        .header-btn { padding: 8px 16px; background: rgba(255,255,255,0.08); border: 1px solid var(--border); border-radius: 10px; color: var(--text-secondary); cursor: pointer; font-size: 0.85em; transition: all 0.3s; display: flex; align-items: center; gap: 6px; }
        .header-btn:hover { background: rgba(255,255,255,0.15); color: var(--accent-gold); border-color: var(--accent-gold); }
        .settings-btn { position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.08); border: 1px solid var(--border); border-radius: 12px; padding: 10px 16px; color: var(--text-secondary); cursor: pointer; font-size: 1.2em; transition: all 0.3s; }
        .settings-btn:hover { background: rgba(255,255,255,0.15); color: var(--accent-gold); }
        .api-status { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.75em; margin-left: 8px; }
        .api-status.ok { background: rgba(0,200,83,0.2); color: #00c853; }
        .api-status.error { background: rgba(255,23,68,0.2); color: #ff1744; }
        .api-status.none { background: rgba(255,255,255,0.08); color: var(--text-secondary); }
        .search-box { max-width: 600px; margin: 20px auto; background: rgba(255,255,255,0.05); border-radius: 16px; padding: 6px; border: 1px solid var(--border); display: flex; gap: 8px; }
        .search-box input { flex: 1; padding: 12px 16px; background: transparent; border: none; color: white; font-size: 1em; outline: none; }
        .search-box input::placeholder { color: var(--text-secondary); }
        .search-box button { padding: 12px 24px; background: linear-gradient(135deg, var(--accent-gold), var(--accent-orange)); border: none; border-radius: 12px; color: #1a1a2e; font-size: 0.95em; font-weight: bold; cursor: pointer; transition: all 0.3s; }
        .search-box button:hover { transform: scale(1.03); box-shadow: 0 8px 25px rgba(255,159,67,0.3); }
        .search-box button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .loading { display: none; text-align: center; padding: 40px 20px; }
        .loading.show { display: block; }
        .loading .spinner { width: 50px; height: 50px; border: 4px solid rgba(255,215,0,0.2); border-top-color: var(--accent-gold); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading p { color: var(--text-secondary); font-size: 1em; }
        .loading .progress { color: var(--accent-gold); margin-top: 8px; font-size: 0.85em; }
        .result-area { display: none; margin-top: 25px; }
        .result-area.show { display: block; }
        .result-card { background: rgba(255,255,255,0.03); border-radius: 16px; padding: 20px; border: 1px solid var(--border); }
        .result-header { display: flex; gap: 20px; margin-bottom: 15px; }
        @media (max-width: 600px) { .result-header { flex-direction: column; align-items: center; text-align: center; } }
        .result-avatar { text-align: center; flex-shrink: 0; }
        .result-avatar img { width: 120px; height: 120px; border-radius: 16px; object-fit: cover; border: 3px solid rgba(255,215,0,0.3); margin-bottom: 8px; }
        .result-avatar .name { font-size: 1.3em; font-weight: bold; color: var(--accent-gold); }
        .result-avatar .title { color: var(--text-secondary); font-size: 0.85em; }
        .result-info { flex: 1; }
        .info-section { background: rgba(255,255,255,0.03); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
        .info-section h4 { color: var(--accent-blue); font-size: 0.85em; margin-bottom: 6px; display: flex; align-items: center; gap: 5px; }
        .info-section p { color: var(--text-secondary); font-size: 0.88em; line-height: 1.6; }
        .attrs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; margin: 15px 0; }
        .attr-card { background: rgba(255,255,255,0.03); border-radius: 12px; padding: 12px; text-align: center; border: 1px solid var(--border); transition: all 0.3s; }
        .attr-card:hover { transform: translateY(-2px); border-color: var(--accent-purple); }
        .attr-card .icon { font-size: 1.6em; margin-bottom: 5px; }
        .attr-card .label { font-size: 0.75em; color: var(--text-secondary); margin-bottom: 3px; }
        .attr-card .value { font-size: 1.1em; font-weight: bold; color: var(--accent-gold); }
        .attr-bar { height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; margin-top: 6px; overflow: hidden; }
        .attr-bar-fill { height: 100%; border-radius: 2px; transition: width 1s ease; }
        .skills-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin: 15px 0; }
        .skill-item { background: rgba(255,255,255,0.03); border-radius: 10px; padding: 12px 15px; display: flex; align-items: center; gap: 12px; border: 1px solid var(--border); }
        .skill-item .skill-icon { font-size: 1.5em; }
        .skill-item .skill-info { flex: 1; }
        .skill-item .skill-name { font-weight: bold; font-size: 0.9em; margin-bottom: 2px; }
        .skill-item .skill-desc { font-size: 0.78em; color: var(--text-secondary); }
        .skill-item .skill-level { font-size: 1.3em; font-weight: bold; color: var(--accent-gold); }
        .quotes-grid { display: grid; gap: 10px; margin: 15px 0; }
        .quote-card { background: linear-gradient(135deg, rgba(200,80,192,0.1), rgba(79,172,254,0.1)); border-radius: 12px; padding: 15px 18px; border-left: 4px solid var(--accent-purple); }
        .quote-card p { font-size: 0.95em; font-style: italic; line-height: 1.5; margin-bottom: 5px; }
        .quote-card .source { font-size: 0.8em; color: var(--accent-gold); }
        .chat-style-section { margin: 15px 0; background: rgba(255,255,255,0.03); border-radius: 12px; padding: 15px; border: 1px solid var(--border); }
        .chat-style-section h4 { color: var(--accent-pink); margin-bottom: 12px; font-size: 0.9em; }
        .chat-example { margin-bottom: 10px; padding: 10px 12px; background: rgba(255,255,255,0.03); border-radius: 8px; }
        .chat-example .role { font-size: 0.75em; padding: 2px 8px; border-radius: 8px; margin-bottom: 5px; display: inline-block; }
        .chat-example .role.user { background: rgba(79,172,254,0.2); color: var(--accent-blue); }
        .chat-example .role.ai { background: rgba(255,107,157,0.2); color: var(--accent-pink); }
        .chat-example .text { color: var(--text-secondary); font-size: 0.88em; line-height: 1.4; }
        .action-btns { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
        .action-btn { flex: 1; min-width: 130px; padding: 12px 18px; border: none; border-radius: 10px; font-size: 0.9em; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: bold; }
        .action-btn:hover { transform: translateY(-2px); }
        .action-btn.primary { background: linear-gradient(135deg, var(--accent-gold), var(--accent-orange)); color: #1a1a2e; }
        .action-btn.secondary { background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink)); color: white; }
        .action-btn.outline { background: transparent; border: 2px solid var(--accent-blue); color: var(--accent-blue); }
        .action-btn.chat-btn { background: linear-gradient(135deg, #00c853, #00e676); color: #1a1a2e; }
        /* CHAT PANEL */
        .chat-panel { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%) translateY(100%); width: 100%; max-width: 800px; height: var(--chat-height); background: var(--bg-secondary); border-radius: 20px 20px 0 0; border: 1px solid var(--border); border-bottom: none; display: flex; flex-direction: column; transition: transform 0.4s cubic-bezier(0.4,0,0.2,1); z-index: 100; box-shadow: 0 -10px 40px rgba(0,0,0,0.5); }
        .chat-panel.open { transform: translateX(-50%) translateY(0); }
        .chat-panel-header { display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; border-bottom: 1px solid var(--border); background: var(--bg-tertiary); border-radius: 20px 20px 0 0; }
        .chat-panel-header .chat-info { display: flex; align-items: center; gap: 12px; }
        .chat-panel-header .chat-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--bg-primary); display: flex; align-items: center; justify-content: center; font-size: 1.3em; border: 2px solid var(--accent-gold); }
        .chat-panel-header .chat-name { font-weight: bold; color: var(--accent-gold); }
        .chat-panel-header .chat-status { font-size: 0.75em; color: var(--text-secondary); }
        .chat-panel-header .chat-actions { display: flex; gap: 8px; }
        .chat-action-btn { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,0.08); border: none; color: var(--text-secondary); cursor: pointer; font-size: 1em; transition: all 0.3s; display: flex; align-items: center; justify-content: center; }
        .chat-action-btn:hover { background: rgba(255,255,255,0.15); color: var(--accent-gold); }
        .chat-action-btn.close-btn:hover { color: #ff5252; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 15px 20px; display: flex; flex-direction: column; gap: 12px; }
        .chat-messages::-webkit-scrollbar { width: 6px; }
        .chat-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
        .chat-msg { display: flex; gap: 10px; max-width: 85%; animation: msgIn 0.3s ease; }
        @keyframes msgIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .chat-msg.user { align-self: flex-end; flex-direction: row-reverse; }
        .chat-msg .msg-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--bg-tertiary); display: flex; align-items: center; justify-content: center; font-size: 1em; flex-shrink: 0; }
        .chat-msg.user .msg-avatar { background: rgba(79,172,254,0.2); }
        .chat-msg.ai .msg-avatar { background: rgba(255,107,157,0.2); }
        .chat-msg .msg-content { background: rgba(255,255,255,0.05); border-radius: 14px; padding: 10px 14px; border: 1px solid var(--border); }
        .chat-msg.user .msg-content { background: rgba(79,172,254,0.15); border-color: rgba(79,172,254,0.3); }
        .chat-msg .msg-text { font-size: 0.92em; line-height: 1.5; color: var(--text-primary); word-break: break-word; }
        .chat-msg .msg-text p { margin-bottom: 8px; }
        .chat-msg .msg-text p:last-child { margin-bottom: 0; }
        .chat-msg .msg-text code { background: rgba(0,0,0,0.3); padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 0.88em; }
        .chat-msg .msg-text pre { background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; overflow-x: auto; margin: 8px 0; }
        .chat-msg .msg-text pre code { background: none; padding: 0; }
        .chat-msg .msg-time { font-size: 0.7em; color: var(--text-secondary); margin-top: 4px; opacity: 0.7; }
        .typing-indicator { display: flex; gap: 5px; padding: 10px 14px; background: rgba(255,255,255,0.05); border-radius: 14px; border: 1px solid var(--border); width: fit-content; }
        .typing-indicator span { width: 8px; height: 8px; background: var(--text-secondary); border-radius: 50%; animation: typing 1.4s infinite; }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing { 0%,60%,100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-6px); opacity: 1; } }
        .chat-input-area { padding: 12px 20px; border-top: 1px solid var(--border); background: var(--bg-tertiary); }
        .chat-input-row { display: flex; gap: 10px; align-items: flex-end; }
        .chat-input { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; color: white; font-size: 0.95em; outline: none; resize: none; max-height: 120px; min-height: 48px; font-family: inherit; transition: border-color 0.3s; }
        .chat-input:focus { border-color: var(--accent-blue); }
        .chat-input::placeholder { color: var(--text-secondary); }
        .chat-send-btn { width: 48px; height: 48px; border-radius: 12px; background: linear-gradient(135deg, var(--accent-gold), var(--accent-orange)); border: none; color: #1a1a2e; font-size: 1.2em; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; justify-content: center; }
        .chat-send-btn:hover { transform: scale(1.05); }
        .chat-send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .chat-settings { padding: 10px 20px 15px; background: var(--bg-tertiary); border-top: 1px solid var(--border); display: none; }
        .chat-settings.show { display: block; }
        .chat-settings h4 { color: var(--text-secondary); font-size: 0.8em; margin-bottom: 10px; }
        .setting-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
        .setting-row label { font-size: 0.82em; color: var(--text-secondary); min-width: 60px; }
        .setting-row input[type="range"] { flex: 1; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; outline: none; -webkit-appearance: none; }
        .setting-row input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; background: var(--accent-gold); border-radius: 50%; cursor: pointer; }
        .setting-row .setting-value { font-size: 0.82em; color: var(--accent-gold); min-width: 40px; text-align: right; }
        /* MODALS */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 200; justify-content: center; align-items: center; }
        .modal-overlay.show { display: flex; }
        .modal { background: var(--bg-secondary); border-radius: 20px; padding: 25px; max-width: 450px; width: 90%; border: 1px solid var(--border); }
        .modal h3 { color: var(--accent-gold); margin-bottom: 18px; display: flex; align-items: center; gap: 8px; }
        .modal .form-group { margin-bottom: 15px; }
        .modal label { display: block; color: var(--text-secondary); font-size: 0.85em; margin-bottom: 6px; }
        .modal input { width: 100%; padding: 10px 12px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 10px; color: white; font-size: 0.95em; outline: none; }
        .modal input:focus { border-color: var(--accent-gold); }
        .modal input[readonly] { opacity: 0.6; cursor: not-allowed; }
        .modal .hint { font-size: 0.75em; color: var(--text-secondary); margin-top: 5px; }
        .modal .test-result { margin-top: 12px; padding: 8px 12px; border-radius: 8px; font-size: 0.85em; display: none; }
        .modal .test-result.show { display: block; }
        .modal .test-result.ok { background: rgba(0,200,83,0.15); color: #00c853; }
        .modal .test-result.error { background: rgba(255,23,68,0.15); color: #ff5252; }
        .modal-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
        .modal-btn { padding: 8px 18px; border-radius: 8px; border: none; font-size: 0.9em; cursor: pointer; transition: all 0.3s; }
        .modal-btn.cancel { background: rgba(255,255,255,0.08); color: var(--text-secondary); }
        .modal-btn.save { background: linear-gradient(135deg, var(--accent-gold), var(--accent-orange)); color: #1a1a2e; font-weight: bold; }
        .modal-btn:hover { transform: scale(1.03); }
        /* SAVED DRAWER */
        .saved-drawer { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 150; justify-content: center; align-items: center; }
        .saved-drawer.show { display: flex; }
        .saved-drawer .drawer-content { background: var(--bg-secondary); border-radius: 20px; padding: 20px; max-width: 500px; width: 90%; max-height: 70vh; overflow-y: auto; border: 1px solid var(--border); }
        .saved-drawer h3 { color: var(--accent-gold); margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .saved-drawer .close-btn { background: none; border: none; color: var(--text-secondary); font-size: 1.5em; cursor: pointer; }
        .saved-item { background: rgba(255,255,255,0.03); border-radius: 12px; padding: 12px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; cursor: pointer; border: 1px solid var(--border); transition: all 0.3s; }
        .saved-item:hover { background: rgba(255,255,255,0.08); border-color: var(--accent-gold); }
        .saved-item .emoji { font-size: 1.8em; }
        .saved-item .info { flex: 1; }
        .saved-item .info .name { font-weight: bold; margin-bottom: 2px; }
        .saved-item .info .date { font-size: 0.75em; color: var(--text-secondary); }
        .saved-item .delete-btn { color: #ff5252; background: none; border: none; font-size: 1.2em; cursor: pointer; padding: 5px; }
        .empty-state { text-align: center; padding: 30px; color: var(--text-secondary); }
        .saved-item { background: rgba(255,255,255,0.03); border-radius: 12px; padding: 12px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; cursor: pointer; border: 1px solid var(--border); transition: all 0.3s; user-select: none; }
        .saved-item:hover { background: rgba(255,255,255,0.08); border-color: var(--accent-gold); }
        .saved-item.dragging { opacity: 0.5; background: rgba(255,215,0,0.1); border-color: var(--accent-gold); }
        .saved-item.drag-over { border-color: var(--accent-blue); background: rgba(79,172,254,0.1); }
        .saved-item .drag-handle { color: var(--text-secondary); font-size: 1.2em; cursor: grab; padding: 0 5px; flex-shrink: 0; }
        .saved-item .drag-handle:active { cursor: grabbing; }
        /* GROUP CHIPS */
        .group-selector { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 5px; }
        .group-chip { padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border); background: rgba(255,255,255,0.05); color: var(--text-secondary); cursor: pointer; font-size: 0.85em; transition: all 0.3s; }
        .group-chip:hover { background: rgba(255,255,255,0.1); border-color: var(--accent-gold); }
        .group-chip.selected { background: rgba(255,215,0,0.15); border-color: var(--accent-gold); color: var(--accent-gold); }
        .group-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; }
        .group-tab { padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border); background: rgba(255,255,255,0.05); color: var(--text-secondary); cursor: pointer; font-size: 0.82em; transition: all 0.3s; }
        .group-tab:hover { background: rgba(255,255,255,0.1); }
        .group-tab.active { background: linear-gradient(135deg, var(--accent-gold), var(--accent-orange)); border-color: transparent; color: #1a1a2e; font-weight: bold; }
        footer { text-align: center; padding: 20px; color: var(--text-secondary); font-size: 0.8em; border-top: 1px solid var(--border); margin-top: 30px; }
        
        /* Debate Panel */
        .debate-panel { display: none; margin-top: 20px; }
        .debate-panel.show { display: block; }
        .debate-topic { background: linear-gradient(135deg, rgba(200,80,192,0.15), rgba(79,172,254,0.15)); border-radius: 16px; padding: 20px; margin-bottom: 20px; border: 1px solid var(--border); text-align: center; }
        .debate-topic h3 { color: var(--accent-gold); margin-bottom: 8px; font-size: 1.1em; }
        .debate-topic p { color: var(--text-secondary); font-size: 0.95em; }
        .debate-topic .topic-input { width: 100%; max-width: 500px; padding: 12px 16px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 12px; color: white; font-size: 1em; outline: none; text-align: center; margin-top: 12px; }
        .debate-topic .topic-input:focus { border-color: var(--accent-gold); }
        .debate-controls { display: flex; gap: 10px; justify-content: center; margin-top: 15px; flex-wrap: wrap; }
        .debate-controls button { padding: 10px 24px; border-radius: 12px; border: none; font-size: 0.9em; cursor: pointer; font-weight: bold; transition: all 0.3s; }
        .debate-controls .start-btn { background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink)); color: white; }
        .debate-controls .add-btn { background: rgba(255,255,255,0.08); border: 1px solid var(--border); color: var(--text-secondary); }
        .debate-controls .close-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text-secondary); }
        .debate-controls button:hover { transform: translateY(-2px); }
        .debate-participants { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; justify-content: center; }
        .debate-participant-chip { padding: 6px 14px; background: rgba(255,215,0,0.1); border: 1px solid var(--accent-gold); border-radius: 20px; color: var(--accent-gold); font-size: 0.85em; display: flex; align-items: center; gap: 6px; }
        .debate-participant-chip .remove { background: none; border: none; color: var(--accent-gold); cursor: pointer; font-size: 1em; padding: 0; line-height: 1; }
        .debate-round { margin-bottom: 20px; }
        .debate-round-title { color: var(--text-secondary); font-size: 0.85em; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
        .debate-messages { display: grid; gap: 12px; }
        .debate-msg { background: rgba(255,255,255,0.03); border-radius: 14px; padding: 14px 16px; border: 1px solid var(--border); display: flex; gap: 12px; animation: msgIn 0.4s ease; }
        .debate-msg .d-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--bg-tertiary); display: flex; align-items: center; justify-content: center; font-size: 1.3em; flex-shrink: 0; border: 2px solid; }
        .debate-msg .d-body { flex: 1; }
        .debate-msg .d-name { font-weight: bold; color: var(--accent-gold); font-size: 0.9em; margin-bottom: 6px; }
        .debate-msg .d-text { color: var(--text-primary); font-size: 0.9em; line-height: 1.6; }
        .debate-typing { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
        .debate-typing-indicator { display: flex; align-items: center; gap: 8px; padding: 8px 14px; background: rgba(255,255,255,0.03); border-radius: 20px; border: 1px solid var(--border); font-size: 0.85em; color: var(--text-secondary); }
        .debate-typing-indicator .dots span { animation: typing 1.4s infinite; }
        .debate-typing-indicator .dots span:nth-child(2) { animation-delay: 0.2s; }
        .debate-typing-indicator .dots span:nth-child(3) { animation-delay: 0.4s; }
        .debate-actions { text-align: center; margin-top: 20px; }
        .debate-next-btn { padding: 12px 36px; background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink)); border: none; border-radius: 14px; color: white; font-size: 1em; font-weight: bold; cursor: pointer; transition: all 0.3s; }
        .debate-next-btn:hover { transform: scale(1.05); }
        .debate-next-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .debate-summary { background: linear-gradient(135deg, rgba(255,215,0,0.1), rgba(255,159,67,0.1)); border-radius: 16px; padding: 20px; margin-top: 20px; border: 1px solid rgba(255,215,0,0.2); }
        .debate-summary h4 { color: var(--accent-gold); margin-bottom: 12px; }
    </style>
</head>
<body>
    <div class="bg"></div>
    
    <!-- Settings Modal -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <h3>⚙️ API 设置</h3>
            <div class="form-group">
                <label>MiniMax API Key</label>
                <input type="password" id="apiKeyInput" placeholder="输入你的 API Key">
                <div class="hint">Key 仅保存在浏览器本地。</div>
            </div>
            <div class="form-group">
                <label>API 代理地址（可选）</label>
                <input type="text" id="apiProxyInput" placeholder="留空使用默认">
            </div>
            <div class="form-group">
                <label>模型名称</label>
                <input type="text" id="modelNameInput" placeholder="默认: MiniMax-M2.7">
            </div>
            <div class="test-result" id="testResult"></div>
            <div class="modal-btns">
                <button class="modal-btn cancel" onclick="closeSettings()">取消</button>
                <button class="modal-btn save" onclick="testApi()">测试</button>
                <button class="modal-btn save" onclick="saveSettings()">保存</button>
            </div>
        </div>
    </div>
    
    <!-- Save Modal -->
    <div class="modal-overlay" id="saveModal">
        <div class="modal">
            <h3>💾 保存人物</h3>
            <div class="form-group">
                <label>人物名称</label>
                <input type="text" id="saveNameInput" readonly>
            </div>
            <div class="form-group">
                <label>选择分组</label>
                <div class="group-selector" id="groupSelector"></div>
            </div>
            <div class="form-group">
                <label>新建分组</label>
                <div style="display:flex;gap:8px">
                    <input type="text" id="newGroupInput" placeholder="输入分组名称...">
                    <button class="modal-btn save" style="padding:10px 16px;flex-shrink:0" onclick="createNewGroup()">+ 新建</button>
                </div>
            </div>
            <div class="modal-btns">
                <button class="modal-btn cancel" onclick="closeSaveModal()">取消</button>
                <button class="modal-btn save" onclick="confirmSavePersona()">保存</button>
            </div>
        </div>
    </div>
    
    <!-- Saved Drawer -->
    <div class="saved-drawer" id="savedDrawer">
        <div class="drawer-content">
            <h3>📚 已保存的人物 <button class="close-btn" onclick="closeSavedDrawer()">×</button></h3>
            <div class="group-tabs" id="groupTabs"></div>
            <div id="savedList" style="max-height:50vh;overflow-y:auto"></div>
        </div>
    </div>
    
    <!-- Main -->
    <div class="container">
        <header>
            <h1>🎭 AI人物重现器</h1>
            <p>输入任意人物、职业或角色名称，获取完整智能体设定 <span class="api-status none" id="apiStatus">未配置</span></p>
            <div class="header-actions">
                <button class="header-btn" onclick="openSavedDrawer()">📚 已保存 (<span id="savedCount">0</span>)</button>
                <button class="header-btn" onclick="document.getElementById('fileImport').click()">📥 导入JSON</button>
                <input type="file" id="fileImport" accept=".json" style="display:none" onchange="importPersonaFile(event)">
            </div>
            <button class="settings-btn" onclick="openSettings()" title="API设置">⚙️</button>
        </header>
        
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="输入任意人物：曹操、马斯克、律师、医生...">
            <button onclick="generatePersona()" id="generateBtn">🔮 生成</button>
        </div>
        
        <div class="loading" id="loadingArea">
            <div class="spinner"></div>
            <p>正在生成人物设定...</p>
            <p class="progress" id="progressText">正在调用 MiniMax...</p>
        </div>
        
        <div class="result-area" id="resultArea"></div>
    </div>
    
    <!-- Debate Modal -->
    <div class="modal-overlay" id="debateModal">
        <div class="modal" style="max-width:550px">
            <h3>🔥 多角色论道</h3>
            <div class="form-group">
                <label>论道主题 / 问题</label>
                <input type="text" id="debateTopic" placeholder="例如：人工智能是否会取代人类？">
            </div>
            <div class="form-group">
                <label>参与角色（当前人物已加入）</label>
                <div id="debateParticipantChips" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:5px"></div>
                <div style="margin-top:10px">
                    <button class="modal-btn cancel" style="font-size:0.85em" onclick="alert('按钮点击成功');openSavedDrawerForDebate()">+ 从已保存添加</button>
                </div>
            </div>
            <div class="form-group">
                <label>论道轮数</label>
                <div style="display:flex;gap:10px;margin-top:5px">
                    <button class="group-chip selected" id="round1Btn" onclick="setDebateRounds(1)" style="min-width:60px">1轮</button>
                    <button class="group-chip" id="round3Btn" onclick="setDebateRounds(3)" style="min-width:60px">3轮</button>
                    <button class="group-chip" id="round5Btn" onclick="setDebateRounds(5)" style="min-width:60px">5轮</button>
                </div>
            </div>
            <div class="modal-btns">
                <button class="modal-btn cancel" onclick="closeDebateModal()">取消</button>
                <button class="modal-btn save" onclick="startDebate()">开始论道</button>
            </div>
        </div>
    </div>
    
    <!-- Debate Panel -->
    <div class="debate-panel" id="debatePanel">
        <div class="debate-topic">
            <h3>🔥 论道</h3>
            <p id="debateTopicText"></p>
            <input type="text" class="topic-input" id="debateTopicInput" placeholder="输入论道主题..." style="display:none">
            <div class="debate-participants" id="debateParticipants"></div>
            <div class="debate-controls" id="debateControls">
                <button class="add-btn" onclick="document.getElementById('debateTopicInput').style.display='block';document.getElementById('debateTopicInput').focus()">✏️ 改主题</button>
                <button class="close-btn" onclick="closeDebatePanel()">关闭</button>
            </div>
        </div>
        <div id="debateContent"></div>
        <div class="debate-actions" id="debateActions" style="display:none">
            <button class="debate-next-btn" id="debateNextBtn" onclick="nextDebateRound()">下一轮 →</button>
        </div>
        <div class="debate-summary" id="debateSummary" style="display:none">
            <h4>📋 论道总结</h4>
            <div id="debateSummaryContent"></div>
        </div>
    </div>

    <!-- Chat Panel -->
    <div class="chat-panel" id="chatPanel">
        <div class="chat-panel-header">
            <div class="chat-info">
                <div class="chat-avatar" id="chatAvatar">🎭</div>
                <div>
                    <div class="chat-name" id="chatName">人物名称</div>
                    <div class="chat-status" id="chatStatus">在线</div>
                </div>
            </div>
            <div class="chat-actions">
                <button class="chat-action-btn" onclick="toggleChatSettings()" title="参数">⚙️</button>
                <button class="chat-action-btn" onclick="exportChat()" title="导出">📤</button>
                <button class="chat-action-btn" onclick="clearChat()" title="清空">🗑️</button>
                <button class="chat-action-btn close-btn" onclick="toggleChat()" title="关闭">×</button>
            </div>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-settings" id="chatSettings">
            <h4>🎛️ 对话参数</h4>
            <div class="setting-row">
                <label>温度</label>
                <input type="range" id="tempSlider" min="0" max="100" value="70">
                <span class="setting-value" id="tempValue">0.7</span>
            </div>
            <div class="setting-row">
                <label>最大Tokens</label>
                <input type="range" id="maxTokensSlider" min="256" max="8192" value="4096" step="256">
                <span class="setting-value" id="maxTokensValue">4096</span>
            </div>
        </div>
        <div class="chat-input-area">
            <div class="chat-input-row">
                <textarea class="chat-input" id="chatInput" placeholder="输入消息... (Enter发送, Shift+Enter换行)" rows="1"></textarea>
                <button class="chat-send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>
    
    <footer>
        <p>🎭 AI人物重现器 | CharRole Platform | Powered by MiniMax M2.7</p>
    </footer>
    
    <script>
        // State
        let currentPersona = null;
        let chatHistory = [];
        let savedPersonas = JSON.parse(localStorage.getItem('saved_personas') || '[]');
        let savedGroups = JSON.parse(localStorage.getItem('saved_groups') || '["默认"]');
        let activeGroup = '全部';
        let isChatOpen = false;
        let pendingSavePersona = null;
        let selectedSaveGroup = savedGroups[0] || '默认';
        
        // Debate state
        let debateParticipants = [];
        let debateRounds = 1;
        let debateCurrentRound = 0;
        let debateTopic = '';
        let debateMessages = [];
        let debateMode = false;
        let debateBasePersona = null;
        
        function openDebateMode() {
            if (!currentPersona) { alert('请先生成一个角色或从已保存中选择一个'); return; }
            debateBasePersona = currentPersona;
            debateParticipants = [{ ...currentPersona, isBase: true }];
            debateRounds = 1;
            debateCurrentRound = 0;
            debateMessages = [];
            debateTopic = '';
            renderDebateParticipantChips();
            document.getElementById('debateTopic').value = '';
            document.getElementById('round1Btn').className = 'group-chip selected';
            document.getElementById('round3Btn').className = 'group-chip';
            document.getElementById('round5Btn').className = 'group-chip';
            const modal = document.getElementById('debateModal');
            modal.classList.add('show');
            // Debug: check if modal is visible
            console.log('Debate modal shown, participants:', debateParticipants.length, debateParticipants[0]?.name);
        }
        function closeDebateModal() { document.getElementById('debateModal').classList.remove('show'); }
        function renderDebateParticipantChips() {
            document.getElementById('debateParticipantChips').innerHTML = debateParticipants.map((p, i) => 
                `<div class="debate-participant-chip">${p.emoji} ${p.name}${p.isBase ? ' ★' : ''}<button class="remove" onclick="removeDebateParticipant(${i})">×</button></div>`
            ).join('');
        }
        function removeDebateParticipant(idx) { if (debateParticipants[idx].isBase) { alert('基础角色不能移除'); return; } debateParticipants.splice(idx, 1); renderDebateParticipantChips(); }
        function setDebateRounds(n) { debateRounds = n; document.querySelectorAll('[id^=round][id$=Btn]').forEach(b => b.className = 'group-chip'); document.getElementById('round' + n + 'Btn').className = 'group-chip selected'; }
        function openSavedDrawerForDebate() {
            closeDebateModal();
            console.log('Opening saved drawer for debate selection...');
            openSavedDrawerForSelection();
        }
        function openSavedDrawerForSelection() {
            activeGroup = '全部';
            renderGroupTabsForSelection();
            renderSavedListForSelection();
            document.getElementById('savedDrawer').classList.add('show');
            console.log('Saved drawer shown, groups:', savedGroups, 'savedPersonas:', savedPersonas.length);
        }
        function renderGroupTabsForSelection() {
            const allGroups = ['全部', ...savedGroups];
            document.getElementById('groupTabs').innerHTML = allGroups.map(g => `<button class="group-tab ${g === activeGroup ? 'active' : ''}" onclick="selectGroupForDebate('${g}')">${g}</button>`).join('') + `<div class="group-actions"><button class="group-action-btn" onclick="confirmDebateSelection()">✓ 确定添加</button></div>`;
        }
        function selectGroupForDebate(g) { activeGroup = g; renderGroupTabsForSelection(); renderSavedListForSelection(); }
        function renderSavedListForSelection() {
            const list = document.getElementById('savedList');
            const filtered = activeGroup === '全部' ? savedPersonas : savedPersonas.filter(p => p.group === activeGroup);
            if (filtered.length === 0) { list.innerHTML = '<div class="empty-state">选择要添加的角色</div>'; return; }
            list.innerHTML = filtered.map((p, i) => {
                const realIdx = savedPersonas.indexOf(p);
                const added = debateParticipants.some(dp => dp.name === p.name);
                return `<div class="saved-item" style="${added ? 'opacity:0.5' : ''}" onclick="${added ? '' : 'addDebateParticipant(' + realIdx + ')'}">${added ? '<span style="color:var(--accent-gold);font-size:0.85em;margin-right:8px">已添加</span>' : ''}<div class="emoji">${p.emoji}</div><div class="info"><div class="name">${p.name}</div><div class="date">${p.group || ''}</div></div></div>`;
            }).join('');
        }
        function addDebateParticipant(idx) {
            const p = savedPersonas[idx];
            if (debateParticipants.some(dp => dp.name === p.name)) { alert('该角色已在列表中'); return; }
            debateParticipants.push({ ...p, isBase: false });
            renderDebateParticipantChips();
            renderSavedListForSelection();
        }
        function confirmDebateSelection() {
            console.log('confirmDebateSelection called, debateParticipants:', debateParticipants.length);
            alert('添加了 ' + debateParticipants.length + ' 个角色，确定返回');
            closeSavedDrawer();
            document.getElementById('debateModal').classList.add('show');
        }
        async function startDebate() {
            try {
                const topic = document.getElementById('debateTopic').value.trim();
                if (!topic) { alert('请输入论道主题'); return; }
                if (debateParticipants.length < 1) { alert('请至少添加一个角色'); return; }
                debateTopic = topic;
                debateCurrentRound = 0;
                debateMessages = [];
                closeDebateModal();
                const panel = document.getElementById('debatePanel');
                panel.classList.add('show');
                document.getElementById('debateTopicText').textContent = topic;
                document.getElementById('debateParticipants').innerHTML = debateParticipants.map(p => `<div class="debate-participant-chip">${p.emoji} ${p.name}</div>`).join('');
                document.getElementById('debateContent').innerHTML = '';
                document.getElementById('debateActions').style.display = 'none';
                document.getElementById('debateSummary').style.display = 'none';
                await runDebateRound();
            } catch(e) {
                alert('论道出错: ' + e.message);
                console.error('Debate error:', e);
            }
        }
        async function runDebateRound() {
            debateCurrentRound++;
            const roundTitle = document.createElement('div');
            roundTitle.className = 'debate-round-title';
            roundTitle.textContent = `第 ${debateCurrentRound} 轮`;
            document.getElementById('debateContent').appendChild(roundTitle);
            const msgContainer = document.createElement('div');
            msgContainer.className = 'debate-messages';
            msgContainer.id = 'roundMsgs_' + debateCurrentRound;
            document.getElementById('debateContent').appendChild(msgContainer);
            const typingContainer = document.createElement('div');
            typingContainer.className = 'debate-typing';
            typingContainer.id = 'typing_' + debateCurrentRound;
            document.getElementById('debateContent').appendChild(typingContainer);
            document.getElementById('debateActions').style.display = 'none';
            const allMsgs = [];
            for (const p of debateParticipants) {
                typingContainer.innerHTML = `<div class="debate-typing-indicator">${p.emoji} ${p.name} 思考中<span class="dots"><span>.</span><span>.</span><span>.</span></span></div>`;
                const msg = await generateDebateMessage(p, debateTopic, debateCurrentRound, allMsgs);
                allMsgs.push({ persona: p, text: msg });
                debateMessages.push({ round: debateCurrentRound, persona: p, text: msg });
                const el = document.createElement('div');
                el.className = 'debate-msg';
                el.innerHTML = `<div class="d-avatar" style="border-color:${getAvatarColor(debateParticipants.indexOf(p))}">${p.emoji}</div><div class="d-body"><div class="d-name">${p.name}</div><div class="d-text">${escapeHtml(msg)}</div></div>`;
                msgContainer.appendChild(el);
                typingContainer.innerHTML = '';
            }
            typingContainer.remove();
            document.getElementById('debateContent').scrollTop = document.getElementById('debateContent').scrollHeight;
            if (debateCurrentRound < debateRounds) {
                document.getElementById('debateNextBtn').textContent = `下一轮 (${debateCurrentRound + 1}/${debateRounds}) →`;
                document.getElementById('debateActions').style.display = 'block';
            } else {
                document.getElementById('debateNextBtn').textContent = '生成总结';
                document.getElementById('debateNextBtn').onclick = generateDebateSummary;
                document.getElementById('debateActions').style.display = 'block';
            }
        }
        async function generateDebateMessage(persona, topic, round, previousMsgs) {
            if (!apiKey) return `[离线模式] ${persona.name} 认为：这个问题值得深入思考...`;
            let context = `你是${persona.name}（${persona.title || ''}）。`;
            if (persona.description) context += persona.description;
            if (persona.personality) context += `性格特点：${persona.personality}`;
            context += `\n\n当前论道主题：「${topic}」`;
            if (round > 1 && previousMsgs.length > 0) {
                context += `\n\n前面已经发表的的观点：\n`;
                previousMsgs.forEach(m => { context += `- ${m.persona.name}：${m.text}\n`; });
                context += `\n请从你的角度，对上述观点发表新的看法或进行辩论。`;
            } else {
                context += `\n\n请从你的角度，发表对这个主题的看法。`;
            }
            try {
                const resp = await fetch(`${apiProxy || 'https://api.minimax.chat'}/v1/messages`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
                    body: JSON.stringify({ model: modelName, max_tokens: 1500, temperature: 0.8, messages: [{ role: 'system', content: context }, { role: 'user', content: '请发表你的观点。' }] })
                });
                if (!resp.ok) return `${persona.name} 表示：这个问题需要更多思考...`;
                const result = await resp.json();
                let text = '';
                if (Array.isArray(result.content)) { const t = result.content.find(c => c.type === 'text'); text = t?.text || result.content[0]?.text || ''; }
                else if (result.content?.text) text = result.content.text;
                return text.trim();
            } catch { return `${persona.name} 表示：暂无看法...`; }
        }
        async function generateDebateSummary() {
            document.getElementById('debateNextBtn').disabled = true;
            document.getElementById('debateNextBtn').textContent = '生成总结中...';
            const summaryEl = document.getElementById('debateSummaryContent');
            document.getElementById('debateSummary').style.display = 'block';
            summaryEl.innerHTML = '<p style="color:var(--text-secondary)">正在生成论道总结...</p>';
            document.getElementById('debateContent').scrollTop = document.getElementById('debateContent').scrollHeight;
            if (!apiKey) {
                summaryEl.innerHTML = '<p style="color:var(--text-secondary)">总结：各角色从不同角度发表了看法，详见上方内容。</p>';
                document.getElementById('debateNextBtn').style.display = 'none';
                return;
            }
            const summaryPrompt = `以下是关于「${debateTopic}」的论道记录：\n`;
            debateMessages.forEach(m => { summaryPrompt += `${m.persona.name}（${m.persona.title || ''}）：${m.text}\n\n`; });
            summaryPrompt += `请生成一段200字左右的总结，客观概括各角色的核心观点、共识与分歧。`;
            try {
                const resp = await fetch(`${apiProxy || 'https://api.minimax.chat'}/v1/messages`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
                    body: JSON.stringify({ model: modelName, max_tokens: 800, temperature: 0.6, messages: [{ role: 'user', content: summaryPrompt }] })
                });
                if (resp.ok) {
                    const result = await resp.json();
                    let text = '';
                    if (Array.isArray(result.content)) { const t = result.content.find(c => c.type === 'text'); text = t?.text || result.content[0]?.text || ''; }
                    else if (result.content?.text) text = result.content.text;
                    summaryEl.innerHTML = `<p style="line-height:1.7">${text}</p><button onclick="exportDebateRecord()" style="margin-top:12px;padding:8px 16px;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:8px;color:var(--text-secondary);cursor:pointer">📤 导出论道记录</button>`;
                } else {
                    summaryEl.innerHTML = '<p style="color:var(--text-secondary)">总结生成失败</p>';
                }
            } catch { summaryEl.innerHTML = '<p style="color:var(--text-secondary)">总结生成失败</p>'; }
            document.getElementById('debateNextBtn').style.display = 'none';
        }
        function nextDebateRound() { runDebateRound(); }
        function closeDebatePanel() {
            document.getElementById('debatePanel').classList.remove('show');
            debateMessages = [];
            debateCurrentRound = 0;
        }
        function exportDebateRecord() {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([JSON.stringify({ topic: debateTopic, participants: debateParticipants, messages: debateMessages }, null, 2)], { type: 'application/json' }));
            a.download = `论道_${debateTopic}_${Date.now()}.json`;
            a.click();
        }

        // Drag & Drop
        let draggedIdx = null;
        function onDragStart(e) { draggedIdx = parseInt(e.currentTarget.dataset.idx); e.currentTarget.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; }
        function onDragOver(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; const item = e.currentTarget; if (item.classList.contains('saved-item') && !item.classList.contains('dragging')) item.classList.add('drag-over'); }
        function onDrop(e) {
            e.preventDefault();
            const items = document.querySelectorAll('.saved-item:not(.dragging)');
            items.forEach(i => i.classList.remove('drag-over'));
            if (draggedIdx === null) return;
            const dropTarget = e.currentTarget;
            if (!dropTarget.classList.contains('saved-item')) return;
            const targetIdx = parseInt(dropTarget.dataset.idx);
            if (draggedIdx === targetIdx) return;
            // Reorder: remove dragged item and insert at target position
            const [moved] = savedPersonas.splice(draggedIdx, 1);
            // Adjust targetIdx if needed (since we removed an item before it)
            const newTargetIdx = targetIdx > draggedIdx ? targetIdx - 1 : targetIdx;
            savedPersonas.splice(newTargetIdx, 0, moved);
            localStorage.setItem('saved_personas', JSON.stringify(savedPersonas));
            renderGroupTabs();
            renderSavedList();
        }
        function onDragEnd(e) { draggedIdx = null; document.querySelectorAll('.saved-item').forEach(i => { i.classList.remove('dragging'); i.classList.remove('drag-over'); }); }

            reader.readAsText(file);

        async function generateWithAI(name) {
            const systemPrompt = `你是一个专业、资深的人物设定专家。请为"${name}"生成极详细、极丰富的AI智能体设定，JSON必须包含：name/title/emoji/description(300-400字)/personality(100-150字)/values(100-150字)/experience/lifeEvents数组(含event/year/desc)/legendaryStories数组(含story/desc)/attrs数组6项(含icon/label/value 1-100/color)/skills数组5项(含icon/name/desc 40-60字/level)/quotes数组5项(含text/source)/chatStyle(含greeting 30-50字/styleDesc/examples数组)。历史人物引用真实史料典故，现代名人结合真实经历。直接返回纯JSON，不要任何其他文字。`;
            
            document.getElementById('progressText').textContent = '📖 检索人物资料...';
            const resp = await fetch(`${apiProxy || 'https://api.minimax.chat'}/anthropic/v1/messages`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
                body: JSON.stringify({ model: modelName, max_tokens: 8000, messages: [{ role: 'system', content: systemPrompt }, { role: 'user', content: `请为"${name}"生成完整的人物AI智能体设定，直接返回JSON。` }] })
            });
            if (!resp.ok) { const err = await resp.json().catch(()=>({})); throw new Error(err.error?.message || `API错误 ${resp.status}`); }
            
            document.getElementById('progressText').textContent = '✨ 生成人物设定...';
            const result = await resp.json();
            let text = '';
            if (Array.isArray(result.content)) { const t = result.content.find(c => c.type === 'text'); text = t?.text || result.content[0]?.text || ''; }
            else if (result.content?.text) text = result.content.text;
            text = text.trim().replace(/^```json\s*/i,'').replace(/^```\s*/i,'').replace(/```$/i,'').trim();
            const m = text.match(/\{[\s\S]*\}/); if (m) text = m[0];
            try { return JSON.parse(text); }
            catch(e) { console.error('Parse error:', e, 'Text:', text.substring(0, 500)); throw new Error('AI返回格式异常，请重试'); }
        }

        async function sendMessage() {
            const inp = document.getElementById('chatInput');
            const text = inp.value.trim();
            if (!text || !apiKey) { if (!apiKey) alert('请先配置 API Key！'); return; }
            chatHistory.push({ role: 'user', content: text, time: Date.now() });
            inp.value = '';
            renderMessages();
            
            const sys = currentPersona ? `你是${currentPersona.name}（${currentPersona.title || ''}）。【背景】${currentPersona.description || ''}【性格】${currentPersona.personality || ''}【价值观】${currentPersona.values || ''}【说话风格】${currentPersona.chatStyle?.styleDesc || ''}开场白：${currentPersona.chatStyle?.greeting || ''}你现在就是${currentPersona.name}，用符合人物性格和人生阅历的方式回答，要有情感和温度。` : '你是一个有用的助手。';
            
            document.getElementById('sendBtn').disabled = true;
            addTyping();
            try {
                const resp = await fetch(`${apiProxy || 'https://api.minimax.chat'}/anthropic/v1/messages`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
                    body: JSON.stringify({ model: modelName, max_tokens: maxTokens, temperature: temperature, messages: [{ role: 'system', content: sys }, ...chatHistory.filter(m => m.role !== 'system').map(m => ({ role: m.role, content: m.content }))] })
                });
                removeTyping();
                if (!resp.ok) { const err = await resp.json().catch(()=>({})); throw new Error(err.error?.message || `错误 ${resp.status}`); }
                const result = await resp.json();
                let reply = ''; const t = Array.isArray(result.content) ? result.content.find(c => c.type === 'text') : null; reply = t?.text || result.content?.[0]?.text || '（无回复）';
                chatHistory.push({ role: 'assistant', content: reply, time: Date.now() });
                renderMessages();
            } catch(e) { removeTyping(); chatHistory.push({ role: 'assistant', content: `⚠️ ${e.message}`, time: Date.now() }); renderMessages(); }
            finally { document.getElementById('sendBtn').disabled = false; }
        }
        
        function clearChat() { if (!confirm('确定清空对话？')) return; chatHistory = []; if (currentPersona?.chatStyle?.greeting) chatHistory.push({ role: 'assistant', content: currentPersona.chatStyle.greeting, time: Date.now() }); renderMessages(); }
        function exportChat() { if (!chatHistory.length) { alert('没有对话'); return; } const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify({ persona: currentPersona, history: chatHistory }, null, 2)], { type: 'application/json' })); a.download = `chat_${currentPersona?.name || 'export'}_${Date.now()}.json`; a.click(); }
        
        // Events
        document.getElementById('chatInput').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
        document.getElementById('chatInput').addEventListener('input', function() { this.style.height = 'auto'; this.style.height = Math.min(this.scrollHeight, 120) + 'px'; });
        document.getElementById('searchInput').addEventListener('keypress', e => { if (e.key === 'Enter') generatePersona(); });
        document.getElementById('tempSlider').addEventListener('input', function() { temperature = this.value / 100; document.getElementById('tempValue').textContent = temperature.toFixed(1); });
        document.getElementById('maxTokensSlider').addEventListener('input', function() { maxTokens = parseInt(this.value); document.getElementById('maxTokensValue').textContent = maxTokens; });
        document.getElementById('settingsModal').addEventListener('click', e => { if (e.target === document.getElementById('settingsModal')) closeSettings(); });
        document.getElementById('savedDrawer').addEventListener('click', e => { if (e.target === document.getElementById('savedDrawer')) closeSavedDrawer(); });
        document.getElementById('saveModal').addEventListener('click', e => { if (e.target === document.getElementById('saveModal')) closeSaveModal(); });
    </script>
</body>
</html>
